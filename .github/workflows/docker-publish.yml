name: Build, publish, and deploy Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: lundbot-production-deploy
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: magnushlund/lundbot-discord

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./bot
          file: ./bot/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/lundbot-discord' }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BOT_API_KEY: ${{ secrets.BOT_API_KEY }}
          BOT_API_PORT: ${{ secrets.BOT_API_PORT || '3000' }}
          BOT_IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: DEPLOY_PATH,GHCR_USERNAME,GHCR_TOKEN,DISCORD_TOKEN,DATABASE_URL,BOT_API_KEY,BOT_API_PORT,BOT_IMAGE_TAG
          script: |
            set -e

            mkdir -p "$DEPLOY_PATH"

            cat > "$DEPLOY_PATH/docker-compose.yml" <<'EOF'
            services:
              bot:
                image: ghcr.io/magnushlund/lundbot-discord:${BOT_IMAGE_TAG:-latest}
                pull_policy: always
                restart: unless-stopped
                env_file:
                  - ./.env
                environment:
                  DATABASE_URL: ${DATABASE_URL}
                  BOT_API_PORT: ${BOT_API_PORT:-3000}
                ports:
                  - '${BOT_API_PORT:-3000}:3000'
            EOF

            printf '%s\n' \
              'NODE_ENV=production' \
              "DISCORD_TOKEN=$DISCORD_TOKEN" \
              "DATABASE_URL=$DATABASE_URL" \
              "BOT_API_KEY=$BOT_API_KEY" \
              "BOT_API_PORT=${BOT_API_PORT:-3000}" \
              "BOT_IMAGE_TAG=$BOT_IMAGE_TAG" \
              > "$DEPLOY_PATH/.env"

            chmod 600 "$DEPLOY_PATH/.env"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            cd "$DEPLOY_PATH"
            docker compose pull
            docker compose up -d --remove-orphans
