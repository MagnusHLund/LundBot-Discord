name: Update server version on tag

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  pull-requests: write

jobs:
  update-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract tag name
        id: tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Update version in appsettings.json
        run: |
          jq ".server.version = \"${{ steps.tag.outputs.TAG }}\"" bot/src/appsettings.json > bot/src/appsettings.tmp
          mv bot/src/appsettings.tmp bot/src/appsettings.json

      - name: Commit and push updated file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add bot/src/appsettings.json
          git commit -m "Update server.version to ${{ steps.tag.outputs.TAG }} for tag ${{ steps.tag.outputs.TAG }}"

          # Update the tag
          git push --force origin HEAD:refs/tags/${{ steps.tag.outputs.TAG }}

          # main is protected and requires changes via pull request, so push to a
          # dedicated branch and open a PR instead of pushing directly to main
          BRANCH="update-version/${{ steps.tag.outputs.TAG }}"
          git push origin HEAD:refs/heads/$BRANCH

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Update server.version to ${{ steps.tag.outputs.TAG }}" \
            --body "Automated version bump to ${{ steps.tag.outputs.TAG }}." \
            || echo "Pull request already exists for $BRANCH"

          gh pr merge "$BRANCH" --auto --squash || echo "Could not enable auto-merge for $BRANCH"
