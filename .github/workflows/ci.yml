name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build main project
        run: dotnet build ./bot/src/LundBot.csproj --configuration Release --no-restore

      - name: Build test project
        run: dotnet build ./bot/tests/LundBot.Tests.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ./bot/tests/LundBot.Tests.csproj --configuration Release --no-build --logger "trx"
