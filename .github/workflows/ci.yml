name: CI Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'bot/**'
      - '.github/workflows/ci.yml'
      - '!**/*.md'
  pull_request:
    branches: [main]
    paths:
      - 'bot/**'
      - '.github/workflows/ci.yml'
      - '!**/*.md'

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: LundBotDiscord
        ports:
          - 3306:3306

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ./bot/LundBot.slnx

      - name: Build solution
        run: dotnet build ./bot/LundBot.slnx --configuration Release --no-restore

      - name: Set runtime validation configuration
        run: |
          echo "Discord__Token=dummy" >> $GITHUB_ENV
          echo "Database__ConnectionString=Server=127.0.0.1;Port=3306;Database=LundBotDiscord;User=root;Password=password;" >> $GITHUB_ENV
          echo "Server__ApiKey=dummy" >> $GITHUB_ENV

      - name: Runtime DI validation
        run: |
          echo "Starting runtime validation..."
          dotnet run --project ./bot/src/LundBot.Presentation/LundBot.Presentation.csproj --no-build --configuration Release &
          BOT_PID=$!
          sleep 10
          if ! kill -0 $BOT_PID 2>/dev/null; then
            echo "❌ Runtime failed (DI error or crash detected)"
            exit 1
          fi
          kill $BOT_PID || true
          echo "✅ Runtime validation passed"

  tests:
    name: ${{ matrix.suite }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [Integration, Architecture]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ./bot/tests/LundBot.${{ matrix.suite }}Tests/LundBot.${{ matrix.suite }}Tests.csproj

      - name: Run tests
        id: tests
        run: >-
          dotnet test ./bot/tests/LundBot.${{ matrix.suite }}Tests/LundBot.${{ matrix.suite }}Tests.csproj
          --configuration Release --no-restore
          --logger "trx;LogFileName=tests.trx"
          --results-directory "${{ github.workspace }}/artifacts/test-results/${{ matrix.suite }}"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ always() && steps.tests.outcome != 'skipped' }}
        with:
          name: test-results-${{ matrix.suite }}
          path: ${{ github.workspace }}/artifacts/test-results/${{ matrix.suite }}/*.trx
          if-no-files-found: error
          retention-days: 14
