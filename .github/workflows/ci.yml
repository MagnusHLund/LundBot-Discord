name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'bot/**'
      - '!**/*.md'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: LundBotDiscord
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ./bot/src

      - name: Build solution
        run: dotnet build ./bot/src --configuration Release --no-restore

      - name: Set runtime validation configuration
        run: |
          echo "Discord__Token=dummy" >> $GITHUB_ENV
          echo "Database__ConnectionString=Server=127.0.0.1;Port=3306;Database=LundBotDiscord;User=root;******" >> $GITHUB_ENV

      - name: Runtime DI validation
        run: |
          echo "Starting runtime validation..."
          dotnet run --project ./bot/src/LundBot.csproj --no-build --configuration Release &
          BOT_PID=$!
          sleep 10
          if ! kill -0 $BOT_PID 2>/dev/null; then
            echo "❌ Runtime failed (DI error or crash detected)"
            exit 1
          fi
          kill $BOT_PID || true
          echo "✅ Runtime validation passed"

      #- name: Run tests
      #  run: dotnet test ./bot/tests/LundBot.Tests.csproj --configuration Release --logger "trx" --results-directory ./bot/tests/TestResults

      #- name: Upload test results
      #  uses: actions/upload-artifact@v4
