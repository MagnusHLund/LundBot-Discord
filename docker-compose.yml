services:
  bot:
    build:
      context: ./bot
    container_name: lundbot-discord
    restart: unless-stopped
    volumes:
      - ./bot/src/appsettings.json:/app/appsettings.json:ro
      - ./bot/src/appsettings.Production.json:/app/appsettings.Production.json:ro
      - ./bot/src/Logs:/app/src/Logs
    ports:
      - 3000:65535
    networks:
      - LundBotDiscordNetwork
    env_file:
      - .env

    profiles: ['Production']

  bot-dev:
    build:
      context: ./bot
    container_name: lundbot-discord-dev
    restart: unless-stopped
    volumes:
      - ./bot:/app
      - bot_dev_bin:/app/src/bin
      - bot_dev_obj:/app/src/obj
      - ./bot/src/Logs:/app/src/Logs
    ports:
      - 3000:65535
      - 5679:5678
    networks:
      - LundBotDiscordNetwork
    env_file:
      - .env
    extra_hosts:
      - 'host.docker.internal:host-gateway'

    profiles: ['Development']

  mariadb-dev:
    image: mariadb:11
    container_name: lundbot-mariadb-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 'password'
      MYSQL_DATABASE: 'LundBotDiscord'
    volumes:
      - ./mariadb/dev-data:/var/lib/mysql
    ports:
      - '3306:3306'
    networks:
      - LundBotDiscordNetwork
    profiles: ['Development']

networks:
  LundBotDiscordNetwork:
    driver: bridge

volumes:
  bot_dev_bin:
  bot_dev_obj:
