services:
  bot:
    image: ghcr.io/magnushlund/lundbot-discord:${BOT_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BOT_API_PORT: ${BOT_API_PORT:-3000}
    ports:
      - '${BOT_API_PORT:-3000}:3000'
